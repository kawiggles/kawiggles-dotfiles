[general]
import = ["theme.toml"]

[window]
opacity = 0.7

[font]
size = 15.0

[font.normal]
family = "EnvyCodeR Nerd Font Mono"
style = "Regular"

[cursor]
style = { shape = "Beam", blinking = "On" }

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"
