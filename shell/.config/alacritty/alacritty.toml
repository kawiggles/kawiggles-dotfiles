[general]
import = []

[window]
opacity = 0.75

[font]
size = 12.0

[font.normal]
family = "EnvyCodeR Nerd Font Mono"
style = "Regular"

[colors.primary]
background = "#1c262b"
foreground = "#c1c8d6"

[colors.normal]
black   = "#000000"
red     = "#ee2a29"
green   = "#3fa33f"
yellow  = "#fee92e"
blue    = "#1d80ef"
magenta = "#8800a0"
cyan    = "#16aec9"
white   = "#a4a4a4"

[colors.bright]
black   = "#767676"
red     = "#dc5b60"
green   = "#70be71"
yellow  = "#fef063"
blue    = "#53a4f3"
magenta = "#a94dbb"
cyan    = "#42c6d9"
white   = "#fffefe"

[keyboard]
bindings = [
    { key = "C", mods = "Control|Shift", action = "Copy" },
    { key = "V", mods = "Control|Shift", action = "Paste" }
]

[cursor]
style = { shape = "Beam", blinking = "On" }
